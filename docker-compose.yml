
services:
  nginx:
    image: nginx:latest
    container_name: TS_nginx
    ports:
      - "443:443"
    volumes:
      - /srv/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/nginx/certs:/etc/nginx/certs:ro,z
      - /srv/nginx/logs:/var/log/nginx
      - /srv/uploads:/data/uploads:ro
    depends_on: 
      - nodejs
      - fastapi
    networks: 
      - srv_TS_net
    restart: always


  nodejs:
    build: ./nodejs
    container_name: TS_node
    env_file:
      - ./nodejs/.env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - srv_TS_net

  fastapi:
    build: ./fastapi
    container_name: TS_fastapi
    env_file:
      - ./.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /srv/uploads:/data/uploads
    depends_on:
      - postgres
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h;c=h.HTTPConnection('localhost',3601,timeout=5);c.request('GET','/health');r=c.getresponse();exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s    
    networks:
      - srv_TS_net

  postgres:
    image: postgres:15
    container_name: TS_postgres
    env_file:
      - ./.env
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
        - /srv/postgres/data:/var/lib/postgresql/data
        #- /srv/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
        - srv_TS_net
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]    
        interval: 30s
        timeout: 5s
        retries: 5
        start_period: 20s    


networks:
  srv_TS_net:
    external: true
    name: srv_TS_net
